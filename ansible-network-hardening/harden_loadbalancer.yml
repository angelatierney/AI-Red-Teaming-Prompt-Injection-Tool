---
# Ansible Playbook: Load Balancer Network Hardening
# Ensures firewall is active, restricts to gold-standard ports,
# disables legacy services, and generates secure F5-style config.

- name: Harden load balancer - firewall, ports, legacy services, config
  hosts: loadbalancers
  become: true
  vars:
    # Default deny policy for firewall
    ufw_default_incoming: deny
    ufw_default_outgoing: allow

  tasks:
    # --- 1. Check if firewall is active (ufw or iptables) ---
    - name: Gather service facts (for firewall check)
      ansible.builtin.service_facts:

    - name: Check if UFW is active
      ansible.builtin.command: ufw status
      register: ufw_status
      changed_when: false
      failed_when: false
      when: ansible_facts.services['ufw.service'] is defined

    - name: Check if iptables is in use (firewall-cmd or iptables)
      ansible.builtin.command: iptables -L -n
      register: iptables_status
      changed_when: false
      failed_when: false
      when: ansible_facts.services['ufw.service'] is not defined or ufw_status.rc != 0

    - name: Report firewall status
      ansible.builtin.debug:
        msg: "{{ 'UFW is active' if (ufw_status is defined and ufw_status.rc == 0) else ('iptables in use' if (iptables_status is defined and iptables_status.rc == 0) else 'No firewall detected - consider enabling ufw or iptables') }}"
      when: ufw_status is defined or iptables_status is defined

    # --- 2. Ensure only gold_standard_ports are allowed (UFW path) ---
    - name: Ensure UFW is installed (Debian/Ubuntu)
      ansible.builtin.apt:
        name: ufw
        state: present
      when: ansible_os_family == "Debian"

    - name: Set UFW default policies
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: "{{ ufw_default_incoming }}" }
        - { direction: outgoing, policy: "{{ ufw_default_outgoing }}" }
      when: ansible_os_family == "Debian"

    - name: Allow only gold_standard_ports (UFW)
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ gold_standard_ports }}"
      when: ansible_os_family == "Debian"

    - name: Enable UFW (ensure firewall is active)
      community.general.ufw:
        state: enabled
      when: ansible_os_family == "Debian"

    # --- 2b. Optional: restrict ports with iptables (when UFW not used) ---
    - name: Allow only gold_standard_ports via iptables (firewall rules)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        state: enabled
      loop: "{{ gold_standard_ports }}"
      when:
        - ansible_os_family == "RedHat"
        - ansible_facts.services['firewalld.service'] is defined
      ignore_errors: true

    # --- 3. Disable legacy services (telnet, ftp) ---
    - name: Disable legacy services (telnet, ftp, etc.)
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ legacy_services_to_disable }}"
      ignore_errors: true
      register: legacy_disable_result

    - name: Report disabled legacy services
      ansible.builtin.debug:
        msg: "Attempted to disable: {{ legacy_services_to_disable | join(', ') }}"
      when: legacy_disable_result is changed is defined

    # --- 4. Use template to create f5_config.conf with secure settings ---
    - name: Ensure config directory exists
      ansible.builtin.file:
        path: /etc/loadbalancer
        state: directory
        mode: "0755"

    - name: Create f5_config.conf from template (secure settings)
      ansible.builtin.template:
        src: f5_config.conf.j2
        dest: /etc/loadbalancer/f5_config.conf
        mode: "0644"
        backup: true
