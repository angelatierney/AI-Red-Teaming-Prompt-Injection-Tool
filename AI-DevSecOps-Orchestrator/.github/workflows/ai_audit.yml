name: AI Security Audit

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'legacy_code/**'
      - 'src/**'
  workflow_dispatch:  # Allow manual triggering

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for PR diff
    
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
    
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
    
      - name: Run AI Security Audit
        id: audit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p audit_output
          
          # Find all C files in legacy_code
          find legacy_code -name "*.c" -type f ! -name "*_refactored.c" | while read file; do
            echo "Scanning: $file"
            output_dir="audit_output/$(basename $file .c)"
            mkdir -p "$output_dir"
            python src/agent.py "$file" --provider openai --output "$output_dir" || echo "Warning: Scan failed for $file"
          done
          
          # Combine all risk notes using Python (more reliable than jq)
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path
          
          audit_dir = Path("audit_output")
          summary_file = Path("audit_summary.md")
          
          if not audit_dir.exists():
              print("No audit output directory found")
              exit(0)
          
          with open(summary_file, 'w') as f:
              f.write("## 🔒 AI Security Audit Results\n\n")
              f.write(f"### Scan completed at {os.popen('date -u +%Y-%m-%d\\ %H:%M:%S\\ UTC').read().strip()}\n\n")
              
              total_vulns = 0
              risk_notes = []
              
              for risk_note in audit_dir.rglob("RISK_NOTE.md"):
                  with open(risk_note, 'r') as rn:
                      risk_notes.append(rn.read())
              
              for vuln_file in audit_dir.rglob("vulnerabilities.json"):
                  try:
                      with open(vuln_file, 'r') as vf:
                          vulns = json.load(vf)
                          if isinstance(vulns, list):
                              total_vulns += len(vulns)
                  except:
                      pass
              
              for note in risk_notes:
                  f.write(note)
                  f.write("\n\n---\n\n")
              
              f.write(f"\n### Total Vulnerabilities Found: {total_vulns}\n")
          
          print(f"Summary written to {summary_file}")
          EOF
        continue-on-error: true  # Don't fail PR if audit has issues
    
      - name: Post Risk Note as PR Comment
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read the audit summary
            let comment = '';
            if (fs.existsSync('audit_summary.md')) {
              comment = fs.readFileSync('audit_summary.md', 'utf8');
            } else {
              comment = '## 🔒 AI Security Audit\n\n⚠️ Audit completed but no summary generated. Check workflow logs for details.';
            }
            
            // Add artifacts links
            comment += '\n\n### 📦 Generated Artifacts\n';
            comment += '- Dockerfiles: Check workflow artifacts\n';
            comment += '- Detailed JSON: Check workflow artifacts\n';
            
            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
    
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: audit_output/
          retention-days: 30
